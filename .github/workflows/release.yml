# Builds the theme zip and automatically creates or updates a GitHub Release
# whenever code is pushed to main or package.json version is updated.
name: Release Zip

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 10
          run_install: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm run build

      - name: Test theme
        run: |
          NAME=$(node -p "require('./package.json').name")
          if [ -f "${NAME}.zip" ]; then
            pnpm dlx gscan@latest --v6 --canary --verbose -z "${NAME}.zip"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          VERSION_TAG="v${VERSION}"
          VERSIONED_ZIP="${NAME}-${VERSION}.zip"
          DEFAULT_ZIP="${NAME}.zip"

          # Create versioned zip file from build artifact
          if [ -f "$DEFAULT_ZIP" ]; then
            cp "$DEFAULT_ZIP" "$VERSIONED_ZIP"
          fi

          # Determine release tag name
          if [ "${{ github.event_name }}" = "release" ]; then
            TARGET_TAG="${{ github.event.release.tag_name }}"
          else
            TARGET_TAG="$VERSION_TAG"
          fi

          echo "Target Release Tag: $TARGET_TAG"

          # Check if the release tag already exists on GitHub
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG already exists. Updating release assets..."
            gh release upload "$TARGET_TAG" "$VERSIONED_ZIP" --clobber
          else
            echo "New version $VERSION detected in package.json! Creating GitHub release $TARGET_TAG..."
            gh release create "$TARGET_TAG" "$VERSIONED_ZIP" \
              --title "Release $TARGET_TAG" \
              --generate-notes
          fi